name: Bug report
description: The tester itself crashes, hangs or grades wrongly.
title: "[bug] "
labels: ["bug"]
body:
  - type: textarea
    id: what
    attributes:
      label: What happened?
      description: Include the command you ran and the output (or the traceback).
      render: text
    validations:
      required: true
  - type: textarea
    id: expected
    attributes:
      label: What did you expect instead?
    validations:
      required: true
  - type: input
    id: version
    attributes:
      label: Tester version
      placeholder: output of `python3 -m src --version`
    validations:
      required: true
  - type: input
    id: env
    attributes:
      label: OS, Python and compiler
      placeholder: e.g. Ubuntu 22.04 · Python 3.10 · gcc 11
