name: CI

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  # The real reason this runs on both OSes: macos-latest's `cc` is Apple
  # Clang, ubuntu-latest's is GCC — two real compilers with genuinely
  # different defaults (see c_exam/grader.py's _KR_FUNC_PTR_RE, added
  # after GCC's C23 default rejected a prototype Clang accepted). This
  # is what a one-off local `--cc gcc` check can't give you: the same
  # check on every push, for free, without anyone remembering to run it.
  test:
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, macos-latest]
        # ui.py has a `rich`-present and a plain-ANSI code path; both need
        # covering since `rich` is an optional dependency (README: "No
        # dependencies are required").
        rich: [true, false]
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      # The "rich" leg installs exactly like a student does — `make install`
      # through uv, from uv.lock, with Textual — so the full-screen UI's
      # pilot tests (tests/test_tui_app.py) run for real and the lockfile
      # is proven installable. The Makefile then runs everything with
      # .venv/bin/python. The other leg proves the zero-dependency
      # fallback (no uv, no rich, no Textual — those tests skip themselves).
      - uses: astral-sh/setup-uv@v6
        if: matrix.rich

      - name: make install (uv)
        if: matrix.rich
        run: make install

      # valgrind isn't installable on macOS at all (Apple Silicon included)
      # — this is squarely a Linux/"real 42 school machine" feature (see
      # c_exam/grader.py's --valgrind). tests/test_c_grader.py's valgrind
      # tests skip themselves everywhere it's missing, so this is what
      # actually exercises that code for real instead of only by mock.
      - name: Install valgrind
        if: matrix.os == 'ubuntu-latest'
        run: sudo apt-get update -qq && sudo apt-get install -y --no-install-recommends valgrind

      - name: Show toolchain
        run: |
          python3 --version
          [ -x .venv/bin/python ] && .venv/bin/python --version || true
          cc --version | head -1
          valgrind --version 2>/dev/null || echo "valgrind: not installed on this OS"

      - name: Unit tests + bank self-tests (Python tester)
        run: make test

      - name: Unit tests + bank self-tests (C tester)
        run: make c-test

      # Proves every oracle in both C banks is itself leak-free — the
      # bank's own reference implementations, not just this workflow's
      # synthetic clean/leaky test snippets.
      - name: Leak-check both C banks' own reference implementations
        if: matrix.os == 'ubuntu-latest'
        run: python3 -m c_exam --check --valgrind


  # One lint job instead of a lint step per test leg: ruff, flake8 and
  # mypy --strict (see `make lint`). Installed through uv like the "rich"
  # leg, so mypy sees rich and Textual's own types; LINT_STRICT=1 makes a
  # missing tool a failure instead of a skipped step.
  lint:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - uses: astral-sh/setup-uv@v6

      - name: make install (uv)
        run: make install

      - name: Lint (ruff · flake8 · mypy --strict)
        run: make lint LINT_STRICT=1

  # README promises "any exam machine with nothing but Python 3.8+" — this
  # job is what actually keeps that claim true instead of just asserted.
  # Kept minimal (no rich, no C compile pass, no lint) since its only job
  # is catching syntax/stdlib usage that 3.8 doesn't have.
  minimum-python-version:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.8"

      - name: Unit tests + bank self-tests on the oldest supported Python
        run: make test
