name: Release

# Push a tag like `v0.2.0` and this publishes a GitHub Release whose notes
# are that version's section of CHANGELOG.md. It refuses to publish when
# the tag doesn't match examshell/version.py (and so pyproject.toml — the unit
# tests keep those two in sync), so a release can never claim a version
# the code itself doesn't report via --version or the update check.

on:
  push:
    tags: ["v*"]

permissions:
  contents: write

jobs:
  release:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Tag must match examshell/version.py
        run: |
          code_version=$(python3 -c 'from examshell.version import __version__; print(__version__)')
          if [ "v$code_version" != "$GITHUB_REF_NAME" ]; then
            echo "::error::tag $GITHUB_REF_NAME does not match examshell/version.py ($code_version)"
            exit 1
          fi

      - name: Tests must pass
        run: make test

      - name: Extract release notes from CHANGELOG.md
        run: |
          version="${GITHUB_REF_NAME#v}"
          # Everything from "## <version>" up to (not including) the next "## ".
          awk -v v="$version" '
            /^## / { if (found) exit; if (index($0, "## " v " ") == 1 || $0 == "## " v) { found = 1; next } }
            found { print }
          ' CHANGELOG.md > notes.md
          if [ ! -s notes.md ]; then
            echo "::error::CHANGELOG.md has no '## $version' section"
            exit 1
          fi

      - name: Publish the release
        env:
          GH_TOKEN: ${{ github.token }}
        run: gh release create "$GITHUB_REF_NAME" --title "$GITHUB_REF_NAME" --notes-file notes.md
